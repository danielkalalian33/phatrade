<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>PHATRADE</title>
  <defs>
    <!-- All gradients use objectBoundingBox (%) so they survive the scale transform -->
    <linearGradient id="fv_outline" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#3a6b3a"/>
      <stop offset="100%" stop-color="#4a8040"/>
    </linearGradient>
    <linearGradient id="fv_leaf" x1="20%" y1="10%" x2="80%" y2="95%">
      <stop offset="0%"   stop-color="#a8c080"/>
      <stop offset="45%"  stop-color="#90b068"/>
      <stop offset="100%" stop-color="#6a9050"/>
    </linearGradient>
    <linearGradient id="fv_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5a8848" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#3a6030" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="fv_goldshine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#f8e080"/>
      <stop offset="55%"  stop-color="#d0980a"/>
      <stop offset="100%" stop-color="#a06800"/>
    </linearGradient>
    <linearGradient id="fv_gold" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#f5d060"/>
      <stop offset="40%"  stop-color="#d4a020"/>
      <stop offset="100%" stop-color="#b87800"/>
    </linearGradient>
    <radialGradient id="fv_drop" cx="40%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#ffe880"/>
      <stop offset="100%" stop-color="#c88010"/>
    </radialGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="32" cy="32" r="31" fill="#f8f6f0"/>

  <!--
    Scale the 200×260 logo to fit a ~46×60 content area centred in 64×64.
    Scale factor: 60/260 = 0.2308
    x offset: (64 − 200×0.2308) / 2 = (64 − 46.15) / 2 ≈ 8.9
    y offset: (64 − 260×0.2308) / 2 = (64 − 60) / 2 = 2
  -->
  <g transform="translate(8.9, 2) scale(0.2308)">

    <!-- Outer teardrop outline -->
    <path d="M 100 4
             C 100 4  82 28  65 58
             C 45 95  28 138  28 172
             C 28 220  58 255  100 255
             C 142 255  172 220  172 172
             C 172 138  155 95  135 58
             C 118 28  100 4  100 4 Z"
          fill="none" stroke="url(#fv_outline)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Leaf body -->
    <path d="M 100 100
             C 72 118  50 148  46 178
             C 42 205  52 232  70 246
             C 82 253  92 255  100 254
             C 108 255  118 253  130 246
             C 148 232  158 205  154 178
             C 150 148  128 118  100 100 Z"
          fill="url(#fv_leaf)"/>

    <!-- Leaf right-side shadow -->
    <path d="M 100 120
             C 118 135  140 160  148 188
             C 155 210  150 232  136 246
             C 122 254  110 255  100 254
             C 108 250  118 242  126 228
             C 138 208  144 185  140 162
             C 136 140  122 128  100 120 Z"
          fill="url(#fv_shadow)"/>

    <!-- Primary gold curve -->
    <path d="M 72 72
             C 66 95   60 122  58 150
             C 55 178  62 205  75 228
             C 84 244  94 252  100 254"
          fill="none" stroke="url(#fv_goldshine)"
          stroke-width="13" stroke-linecap="round" opacity="0.90"/>

    <!-- Secondary gold curve -->
    <path d="M 88 60
             C 84 84   80 112  80 142
             C 79 172  85 200  96 224
             C 100 234  104 244  108 252"
          fill="none" stroke="url(#fv_gold)"
          stroke-width="8" stroke-linecap="round" opacity="0.78"/>

    <!-- Gold oil droplet at top -->
    <path d="M 100 26
             C 100 26  88 46  88 58
             a12 12 0 0 0 24 0
             C 112 46  100 26  100 26 Z"
          fill="url(#fv_drop)"/>
    <!-- Drop shine -->
    <path d="M 96 34 C 93 40  92 48  93 55 C 94 48  96 40  96 34 Z"
          fill="rgba(255,248,180,0.7)"/>
    <circle cx="96" cy="38" r="3" fill="rgba(255,252,200,0.5)"/>

  </g>

  <!-- Thin gold ring border -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
</svg>
