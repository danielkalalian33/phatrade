  <path d="M88 185 C76 170 62 164 60 152 C58 142 66 134 74 140 C82 146 86 166 88 185Z" fill="rgba(139,158,90,0.3)"/>
  <path d="M312 185 C324 170 338 164 340 152 C342 142 334 134 326 140 C318 146 314 166 312 185Z" fill="rgba(139,158,90,0.3)"/>
  <!-- Bottle body -->
  <path d="M180 105 L180 250 Q180 260 190 260 L210 260 Q220 260 220 250 L220 105 Z" fill="url(#btl-violet-abs)"/>
  <!-- Liquid -->
  <path d="M182 132 L218 132 L218 250 Q218 258 210 258 L190 258 Q182 258 182 250 Z" fill="rgba(45,75,18,0.88)"/>
  <!-- Shine -->
  <path d="M180 105 L180 250 Q180 260 190 260 L194 260 L194 105 Z" fill="url(#shine-violet-abs)"/>
  <!-- Shoulder -->
  <path d="M177 103 Q177 93 187 93 L213 93 Q223 93 223 103 L220 105 L180 105 Z" fill="#160d04"/>
