  <rect x="193" y="62" width="14" height="33" rx="3" fill="#160d04"/>
  <rect x="193" y="62" width="14" height="33" rx="3" fill="url(#shine-violet-abs)"/>
  <!-- Cap -->
  <rect x="189" y="42" width="22" height="22" rx="5" fill="url(#cap-violet-abs)"/>
  <ellipse cx="200" cy="39" rx="9" ry="7" fill="#7a3a0a"/>
  <ellipse cx="197" cy="36" rx="3.5" ry="2.5" fill="rgba(255,180,80,0.28)"/>
  <!-- Label (dark, luxury) -->
  <rect x="183" y="152" width="34" height="82" rx="2" fill="rgba(8,6,3,0.82)" stroke="rgba(201,168,76,0.6)" stroke-width="0.8"/>
  <rect x="183" y="152" width="34" height="8" rx="2" fill="#C9A84C" opacity="0.8"/>
  <text x="200" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.8" font-weight="700" fill="#1e3326" letter-spacing="1">PHATRADE</text>
  <path d="M200 163 C200 163 197.5 167 197.5 169 a2.5 2.5 0 0 0 5 0 C202.5 167 200 163 200 163Z" fill="#C9A84C"/>
  <text x="200" y="181" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="7" font-weight="900" fill="#C9A84C">VIOLET</text>
  <line x1="186" y1="185" x2="214" y2="185" stroke="rgba(201,168,76,0.5)" stroke-width="0.5"/>
  <text x="200" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="rgba(240,237,228,0.75)" font-style="italic">V. odorata</text>
  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="3.8" fill="rgba(240,237,228,0.65)">Absolute</text>
  <text x="200" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="3.8" fill="rgba(240,237,228,0.55)">Egypt</text>
  <text x="200" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="3.5" fill="rgba(201,168,76,0.5)">100% NATURAL</text>
  <!-- Reflection -->
  <ellipse cx="200" cy="262" rx="22" ry="3.5" fill="rgba(0,0,0,0.38)"/>
