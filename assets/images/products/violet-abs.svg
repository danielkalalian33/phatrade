<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bg-violet-abs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e16"/>
      <stop offset="100%" stop-color="#0e1810"/>
    </linearGradient>
    <linearGradient id="btl-violet-abs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160d04"/>
      <stop offset="50%" stop-color="#241408"/>
      <stop offset="100%" stop-color="#100a02"/>
    </linearGradient>
    <linearGradient id="shine-violet-abs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,200,80,0.3)"/>
      <stop offset="40%" stop-color="rgba(255,200,80,0.0)"/>
    </linearGradient>
    <linearGradient id="cap-violet-abs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c030"/>
      <stop offset="100%" stop-color="#8a6010"/>
    </linearGradient>
    <radialGradient id="glow-violet-abs" cx="45%" cy="35%" r="50%">
      <stop offset="0%" stop-color="rgba(201,168,76,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg-violet-abs)"/>
  <rect width="400" height="280" fill="url(#glow-violet-abs)"/>
  <!-- Gold sparkles -->
  <circle cx="85" cy="65" r="1.2" fill="rgba(201,168,76,0.4)"/>
  <circle cx="315" cy="80" r="1" fill="rgba(201,168,76,0.35)"/>
  <circle cx="100" cy="195" r="1" fill="rgba(201,168,76,0.3)"/>
  <circle cx="305" cy="185" r="1.2" fill="rgba(201,168,76,0.3)"/>
  <circle cx="345" cy="130" r="1" fill="rgba(201,168,76,0.25)"/>
