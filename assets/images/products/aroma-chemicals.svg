<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="ac-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263d2e"/>
      <stop offset="100%" stop-color="#1e3326"/>
    </linearGradient>
    <linearGradient id="ac-vial1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(180,130,30,0.7)"/>
      <stop offset="50%" stop-color="rgba(200,160,60,0.85)"/>
      <stop offset="100%" stop-color="rgba(140,100,20,0.7)"/>
    </linearGradient>
    <linearGradient id="ac-vial2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(80,130,80,0.6)"/>
      <stop offset="50%" stop-color="rgba(100,160,100,0.75)"/>
      <stop offset="100%" stop-color="rgba(60,100,60,0.6)"/>
    </linearGradient>
    <linearGradient id="ac-vial3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(160,100,20,0.65)"/>
      <stop offset="50%" stop-color="rgba(200,140,40,0.8)"/>
      <stop offset="100%" stop-color="rgba(120,80,10,0.65)"/>
    </linearGradient>
    <linearGradient id="ac-rack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4a3e"/>
      <stop offset="100%" stop-color="#2a3a2e"/>
    </linearGradient>
    <radialGradient id="ac-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(139,158,90,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="400" height="280" fill="url(#ac-bg)"/>
  <rect width="400" height="280" fill="url(#ac-glow)"/>

  <!-- Molecule/structure suggestion in background -->
  <g opacity="0.07" stroke="#8B9E5A" stroke-width="1.5" fill="none">
    <circle cx="100" cy="70" r="8"/>
    <circle cx="140" cy="50" r="8"/>
    <circle cx="180" cy="70" r="8"/>
    <circle cx="160" cy="105" r="8"/>
    <circle cx="120" cy="105" r="8"/>
    <line x1="100" y1="70" x2="140" y2="50"/>
    <line x1="140" y1="50" x2="180" y2="70"/>
    <line x1="180" y1="70" x2="160" y2="105"/>
    <line x1="160" y1="105" x2="120" y2="105"/>
    <line x1="120" y1="105" x2="100" y2="70"/>
    <!-- Second molecule -->
    <circle cx="280" cy="80" r="7"/>
    <circle cx="315" cy="62" r="7"/>
    <circle cx="348" cy="80" r="7"/>
    <circle cx="330" cy="112" r="7"/>
    <circle cx="296" cy="112" r="7"/>
    <line x1="280" y1="80" x2="315" y2="62"/>
    <line x1="315" y1="62" x2="348" y2="80"/>
    <line x1="348" y1="80" x2="330" y2="112"/>
    <line x1="330" y1="112" x2="296" y2="112"/>
    <line x1="296" y1="112" x2="280" y2="80"/>
  </g>

  <!-- Vial rack base -->
  <rect x="112" y="220" width="176" height="18" rx="4" fill="url(#ac-rack)"/>
  <rect x="112" y="215" width="176" height="8" rx="3" fill="#4a5a4e"/>

  <!-- 5 vials in rack -->
  <!-- Vial 1 (amber/gold) -->
  <rect x="124" y="100" width="22" height="118" rx="11" fill="rgba(30,25,15,0.7)" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <rect x="126" y="110" width="18" height="108" rx="9" fill="url(#ac-vial1)"/>
  <rect x="126" y="108" width="18" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="128" y="112" width="6" height="60" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="124" y="94" width="22" height="10" rx="5" fill="#2D4A35"/>

  <!-- Vial 2 (olive green) -->
  <rect x="154" y="90" width="22" height="128" rx="11" fill="rgba(20,30,20,0.7)" stroke="rgba(139,158,90,0.3)" stroke-width="1"/>
  <rect x="156" y="100" width="18" height="118" rx="9" fill="url(#ac-vial2)"/>
  <rect x="156" y="98" width="18" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="158" y="102" width="6" height="70" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="154" y="84" width="22" height="10" rx="5" fill="#3D6347"/>

  <!-- Vial 3 (amber - tallest) -->
  <rect x="184" y="80" width="22" height="138" rx="11" fill="rgba(30,20,10,0.7)" stroke="rgba(201,168,76,0.35)" stroke-width="1"/>
  <rect x="186" y="90" width="18" height="128" rx="9" fill="url(#ac-vial3)"/>
  <rect x="186" y="88" width="18" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
  <rect x="188" y="92" width="6" height="80" rx="3" fill="rgba(255,255,255,0.13)"/>
  <rect x="184" y="74" width="22" height="10" rx="5" fill="#2D4A35"/>

  <!-- Vial 4 (green) -->
  <rect x="214" y="92" width="22" height="126" rx="11" fill="rgba(20,30,20,0.7)" stroke="rgba(139,158,90,0.3)" stroke-width="1"/>
  <rect x="216" y="102" width="18" height="116" rx="9" fill="url(#ac-vial2)"/>
  <rect x="216" y="100" width="18" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="218" y="104" width="6" height="65" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="214" y="86" width="22" height="10" rx="5" fill="#3D6347"/>

  <!-- Vial 5 (amber) -->
  <rect x="244" y="105" width="22" height="113" rx="11" fill="rgba(30,25,15,0.7)" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <rect x="246" y="115" width="18" height="103" rx="9" fill="url(#ac-vial1)"/>
  <rect x="246" y="113" width="18" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="248" y="117" width="6" height="55" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="244" y="99" width="22" height="10" rx="5" fill="#2D4A35"/>

  <!-- PHATRADE label on center vial -->
  <rect x="185" y="118" width="20" height="35" rx="2" fill="rgba(240,237,228,0.88)"/>
  <text x="195" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" font-weight="700" fill="#2D4A35" letter-spacing="0.5">PHATRADE</text>
  <path d="M195 132 C195 132 193 135 193 137 a2 2 0 0 0 4 0 C197 135 195 132 195 132Z" fill="#C9A84C"/>
  <text x="195" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="3.5" fill="#2D4A35">ISOLATE</text>

  <!-- GC chromatogram suggestion (small lines) -->
  <g opacity="0.2" stroke="#C9A84C" stroke-width="0.8" fill="none">
    <polyline points="310,200 318,200 320,185 322,198 324,188 326,195 328,200 345,200"/>
    <line x1="310" y1="202" x2="345" y2="202" stroke-width="0.5"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="200" cy="240" rx="80" ry="5" fill="rgba(0,0,0,0.25)"/>
  <text x="200" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="rgba(201,168,76,0.7)" letter-spacing="2">AROMA CHEMICALS</text>
</svg>
