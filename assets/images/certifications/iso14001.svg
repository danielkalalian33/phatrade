<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="ISO 14001 Environmental Management Certified">
  <title>ISO 14001 Environmental Management System</title>
  <defs>
    <clipPath id="gc14k">
      <circle cx="100" cy="108" r="62"/>
    </clipPath>
    <path id="ta14k" d="M 100,108 m -75,0 a 75,75 0 1 1 150,0"/>
  </defs>

  <!-- Latitude lines -->
  <g clip-path="url(#gc14k)" fill="none" stroke="#1358B0" stroke-width="1.4">
    <ellipse cx="100" cy="55"  rx="21" ry="5.1"/>
    <ellipse cx="100" cy="68"  rx="40" ry="9.6"/>
    <ellipse cx="100" cy="83"  rx="56" ry="13.5"/>
    <ellipse cx="100" cy="108" rx="62" ry="14.9"/>
    <ellipse cx="100" cy="133" rx="56" ry="13.5"/>
    <ellipse cx="100" cy="148" rx="40" ry="9.6"/>
    <ellipse cx="100" cy="161" rx="21" ry="5.1"/>
  </g>

  <!-- Longitude lines -->
  <g clip-path="url(#gc14k)" fill="none" stroke="#1358B0" stroke-width="1.4">
    <line  x1="100" y1="46"  x2="100" y2="170"/>
    <ellipse cx="100" cy="108" rx="32" ry="62"/>
    <ellipse cx="100" cy="108" rx="54" ry="62"/>
  </g>

  <!-- Globe outer circle -->
  <circle cx="100" cy="108" r="62" fill="none" stroke="#1358B0" stroke-width="3"/>

  <!-- Arc text -->
  <text font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#1358B0" font-weight="400" dy="-3">
    <textPath href="#ta14k" startOffset="4%">International Organization for Standardization</textPath>
  </text>

  <!-- ISO lettering -->
  <text x="100" y="121" text-anchor="middle"
    font-family="'Arial Black',Arial,Helvetica,sans-serif"
    font-size="50" font-weight="900" fill="#1358B0">ISO</text>

  <!-- Standard number -->
  <text x="100" y="215" text-anchor="middle"
    font-family="'Arial Black',Arial,Helvetica,sans-serif"
    font-size="34" font-weight="900" fill="#1358B0">14001</text>
</svg>
