<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="ISO 22000 Food Safety Management Certified">
  <title>ISO 22000 Food Safety Management System</title>
  <defs>
    <clipPath id="gc22k">
      <circle cx="100" cy="108" r="62"/>
    </clipPath>
    <!-- Top-arc text path (over the globe) -->
    <path id="ta22k" d="M 100,108 m -75,0 a 75,75 0 1 1 150,0"/>
  </defs>

  <!-- Latitude lines (horizontal ovals) -->
  <g clip-path="url(#gc22k)" fill="none" stroke="#1358B0" stroke-width="1.4">
    <ellipse cx="100" cy="55"  rx="21" ry="5.1"/>   <!-- 70 N -->
    <ellipse cx="100" cy="68"  rx="40" ry="9.6"/>   <!-- 50 N -->
    <ellipse cx="100" cy="83"  rx="56" ry="13.5"/>  <!-- 25 N -->
    <ellipse cx="100" cy="108" rx="62" ry="14.9"/>  <!-- equator -->
    <ellipse cx="100" cy="133" rx="56" ry="13.5"/>  <!-- 25 S -->
    <ellipse cx="100" cy="148" rx="40" ry="9.6"/>   <!-- 50 S -->
    <ellipse cx="100" cy="161" rx="21" ry="5.1"/>   <!-- 70 S -->
  </g>

  <!-- Longitude lines (vertical ellipses clipped to globe) -->
  <g clip-path="url(#gc22k)" fill="none" stroke="#1358B0" stroke-width="1.4">
    <line  x1="100" y1="46"  x2="100" y2="170"/>    <!-- central meridian -->
    <ellipse cx="100" cy="108" rx="32" ry="62"/>     <!-- ±30° -->
    <ellipse cx="100" cy="108" rx="54" ry="62"/>     <!-- ±60° -->
  </g>

  <!-- Globe outer circle -->
  <circle cx="100" cy="108" r="62" fill="none" stroke="#1358B0" stroke-width="3"/>

  <!-- "International Organization for Standardization" arc text -->
  <text font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#1358B0" font-weight="400" dy="-3">
    <textPath href="#ta22k" startOffset="4%">International Organization for Standardization</textPath>
  </text>

  <!-- ISO lettering -->
  <text x="100" y="121" text-anchor="middle"
    font-family="'Arial Black',Arial,Helvetica,sans-serif"
    font-size="50" font-weight="900" fill="#1358B0">ISO</text>

  <!-- Standard number -->
  <text x="100" y="215" text-anchor="middle"
    font-family="'Arial Black',Arial,Helvetica,sans-serif"
    font-size="34" font-weight="900" fill="#1358B0">22000</text>
</svg>
