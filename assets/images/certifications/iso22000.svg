<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="ACCENT ISO 22000 Certified">
  <title>ISO 22000 Certified — ACCENT</title>
  <defs>
    <radialGradient id="g22k" cx="40%" cy="35%" r="60%">
      <stop offset="0%"  stop-color="#e8a030"/>
      <stop offset="100%" stop-color="#b06808"/>
    </radialGradient>
    <path id="t22kTop" d="M 12,40 A 28,28 0 0,0 68,40"/>
    <path id="t22kBot" d="M 10,40 A 30,30 0 0,1 70,40"/>
  </defs>
  <!-- Background amber circle -->
  <circle cx="40" cy="40" r="39" fill="url(#g22k)"/>
  <!-- "ACCENT" top arc -->
  <text font-family="'Arial Black',Arial,sans-serif" font-size="9" font-weight="900"
