  <!-- Pixel/dot pattern (lower half decoration) -->
  <g opacity="0.28" fill="white">
    <rect x="10" y="57" width="3" height="3"/><rect x="15" y="57" width="3" height="3"/>
    <rect x="22" y="57" width="3" height="3"/><rect x="35" y="57" width="3" height="3"/>
    <rect x="45" y="57" width="3" height="3"/><rect x="56" y="57" width="3" height="3"/>
    <rect x="63" y="57" width="3" height="3"/>
    <rect x="13" y="62" width="3" height="3"/><rect x="20" y="62" width="3" height="3"/>
    <rect x="30" y="62" width="3" height="3"/><rect x="40" y="62" width="3" height="3"/>
    <rect x="50" y="62" width="3" height="3"/><rect x="60" y="62" width="3" height="3"/>
    <rect x="17" y="67" width="3" height="3"/><rect x="27" y="67" width="3" height="3"/>
    <rect x="37" y="67" width="3" height="3"/><rect x="47" y="67" width="3" height="3"/>
