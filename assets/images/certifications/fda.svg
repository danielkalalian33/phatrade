<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="FDA Approved Certified">
  <title>FDA Approved Certified</title>
  <defs>
    <!-- Top arc: left → top → right (CCW in SVG = goes upward) -->
    <path id="fdaTop" d="M 8,40 A 32,32 0 0,0 72,40"/>
    <!-- Bottom arc: left → bottom → right (CW in SVG = goes downward) -->
    <path id="fdaBot" d="M 8,40 A 32,32 0 0,1 72,40"/>
  </defs>

  <!-- White background -->
  <rect width="80" height="80" fill="white"/>

  <!-- Outer thick ring -->
  <circle cx="40" cy="40" r="37" fill="none" stroke="#1565C0" stroke-width="3.5"/>
  <!-- Inner thin ring -->
  <circle cx="40" cy="40" r="30" fill="none" stroke="#1565C0" stroke-width="1.2"/>

  <!-- "APPROVED" on top arc -->
  <text font-family="'Arial Black',Arial,sans-serif" font-size="7.5" font-weight="900"
        fill="#1565C0" letter-spacing="2">
    <textPath href="#fdaTop" startOffset="10%">APPROVED</textPath>
  </text>

  <!-- "CERTIFIED" on bottom arc (side=right keeps text right-side up) -->
  <text font-family="'Arial Black',Arial,sans-serif" font-size="7.5" font-weight="900"
        fill="#1565C0" letter-spacing="2">
    <textPath href="#fdaBot" startOffset="10%" side="right">CERTIFIED</textPath>
  </text>

  <!-- Left-side 4-pointed stars -->
  <polygon points="14,22 15.4,19.6 14,17.2 16.4,18.6 18.8,17.2 17.4,19.6 18.8,22 16.4,20.6" fill="#1565C0"/>
  <polygon points="11,31 12.4,28.6 11,26.2 13.4,27.6 15.8,26.2 14.4,28.6 15.8,31 13.4,29.6" fill="#1565C0"/>
  <polygon points="11,49 12.4,46.6 11,44.2 13.4,45.6 15.8,44.2 14.4,46.6 15.8,49 13.4,47.6" fill="#1565C0"/>
  <polygon points="14,58 15.4,55.6 14,53.2 16.4,54.6 18.8,53.2 17.4,55.6 18.8,58 16.4,56.6" fill="#1565C0"/>

  <!-- Right-side 4-pointed stars (mirrored) -->
  <polygon points="66,22 67.4,19.6 66,17.2 68.4,18.6 70.8,17.2 69.4,19.6 70.8,22 68.4,20.6" fill="#1565C0"/>
  <polygon points="64,31 65.4,28.6 64,26.2 66.4,27.6 68.8,26.2 67.4,28.6 68.8,31 66.4,29.6" fill="#1565C0"/>
  <polygon points="64,49 65.4,46.6 64,44.2 66.4,45.6 68.8,44.2 67.4,46.6 68.8,49 66.4,47.6" fill="#1565C0"/>
  <polygon points="66,58 67.4,55.6 66,53.2 68.4,54.6 70.8,53.2 69.4,55.6 70.8,58 68.4,56.6" fill="#1565C0"/>

  <!-- Blue centre rectangle with FDA text -->
  <rect x="17" y="33" width="46" height="14" rx="1.5" fill="#1565C0"/>
  <!-- FDA bold white text -->
  <text x="40" y="44" text-anchor="middle"
        font-family="'Arial Black',Arial,sans-serif" font-size="16" font-weight="900"
        fill="white" letter-spacing="1">FDA</text>
</svg>
