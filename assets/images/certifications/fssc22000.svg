<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="160" height="60" role="img" aria-label="FSSC 22000 certified">
  <title>FSSC 22000</title>
  <rect width="160" height="60" fill="white"/>
  <!-- Swirl mark: 3 interlocking arcs -->
  <!-- Outer dark-grey arc (large C, opening bottom-right) -->
  <path d="M 44,8 A 22,22 0 1,0 14,38" fill="none" stroke="#3a3535" stroke-width="8" stroke-linecap="round"/>
  <!-- Middle grey arc (rotated ~120°) -->
  <path d="M 38,6 A 18,18 0 1,0 10,34" fill="none" stroke="#9a9090" stroke-width="6" stroke-linecap="round"/>
  <!-- Inner green arc (rotated ~240°) -->
  <path d="M 18,44 A 14,14 0 1,1 46,20" fill="none" stroke="#2e8b57" stroke-width="7" stroke-linecap="round"/>

  <!-- FSSC text in green -->
  <text x="70" y="36" font-family="'Arial Black',Arial,sans-serif"
    font-size="28" font-weight="900" fill="#2e8b57">FSSC</text>
  <!-- 22000 in grey -->
  <text x="120" y="36" font-family="'Arial Black',Arial,sans-serif"
    font-size="26" font-weight="400" fill="#7a7070">22000</text>
</svg>
