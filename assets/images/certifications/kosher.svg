<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Orthodox Union Kosher Certified">
  <title>Orthodox Union Kosher</title>
  <defs>
    <!-- Top arc for "ORTHODOX UNION" -->
    <path id="ouTop" d="M 6,40 A 34,34 0 0,0 74,40"/>
    <!-- Bottom arc for Hebrew text -->
    <path id="ouBot" d="M 6,40 A 34,34 0 0,1 74,40"/>
  </defs>
  <rect width="80" height="80" fill="white"/>
  <!-- Outer thick black ring -->
  <circle cx="40" cy="40" r="37" fill="none" stroke="black" stroke-width="4"/>
  <!-- Inner thin ring -->
  <circle cx="40" cy="40" r="28" fill="none" stroke="black" stroke-width="3.5"/>
  <!-- Large bold U -->
  <text x="40" y="50" text-anchor="middle"
    font-family="'Times New Roman',Georgia,serif" font-size="32" font-weight="900" fill="black">U</text>
  <!-- "ORTHODOX UNION" on top arc -->
  <text font-family="'Arial Black',Arial,sans-serif" font-size="7" font-weight="900"
    fill="black" letter-spacing="1">
    <textPath href="#ouTop" startOffset="5%">ORTHODOX UNION</textPath>
  </text>
  <!-- Hebrew text on bottom arc (right-side up using side="right") -->
  <text font-family="Arial,sans-serif" font-size="7.5" font-weight="bold" fill="black">
    <textPath href="#ouBot" startOffset="10%" side="right">&#x05D0;&#x05D9;&#x05D7;&#x05D5;&#x05D3; &#x05D4;&#x05D0;&#x05D5;&#x05E8;&#x05EA;&#x05D5;&#x05D3;&#x05D5;&#x05E7;&#x05E1;&#x05D9;</textPath>
  </text>
</svg>
