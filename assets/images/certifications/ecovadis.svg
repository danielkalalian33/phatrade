<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="EcoVadis Committed Sustainability Rating">
  <title>EcoVadis Committed Sustainability Rating</title>

  <!-- White background circle -->
  <circle cx="100" cy="100" r="97" fill="#FFFFFF"/>

  <!-- Outer border ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#C8A86A" stroke-width="2.5"/>
  <!-- Inner border ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#C8A86A" stroke-width="1" opacity="0.6"/>

  <!-- COMMITTED arc text (straight, spaced, at top) -->
  <text x="100" y="38" text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700"
    fill="#B8935A" letter-spacing="4.5">COMMITTED</text>

  <!-- Top divider line -->
  <line x1="55" y1="46" x2="145" y2="46" stroke="#C8A86A" stroke-width="0.9" opacity="0.7"/>

  <!-- ecoVadis wordmark  -->
  <!-- "eco" in dark gray, thin weight -->
  <text x="58" y="88" text-anchor="start"
    font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="300"
    fill="#3A3A3A" letter-spacing="-0.5">eco</text>
  <!-- "V" with green leaf sprout -->
  <text x="100" y="88" text-anchor="start"
    font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="300"
    fill="#3A3A3A" letter-spacing="-0.5">V</text>
  <!-- Green leaf above the V -->
  <ellipse cx="109" cy="63" rx="3.5" ry="6.5" fill="#5DAA6F" transform="rotate(-8 109 63)"/>
  <ellipse cx="113" cy="61" rx="2.8" ry="5.5" fill="#7ABF8A" opacity="0.7" transform="rotate(12 113 61)"/>
  <!-- "adis" continuation -->
  <text x="116" y="88" text-anchor="start"
    font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="300"
    fill="#3A3A3A" letter-spacing="-0.5">adis</text>

  <!-- Sustainability Rating -->
  <text x="100" y="104" text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400"
    fill="#777777" letter-spacing="0.6">Sustainability Rating</text>

  <!-- Divider line -->
  <line x1="55" y1="113" x2="145" y2="113" stroke="#C8A86A" stroke-width="0.9" opacity="0.7"/>

  <!-- JUL 2026 -->
  <text x="100" y="132" text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700"
    fill="#3A3A3A" letter-spacing="2">JUL 2026</text>

  <!-- Green leaf decorations at bottom -->
  <!-- Left outer leaf -->
  <path d="M 100,182 C 72,172 55,150 66,128 C 78,150 96,166 100,175 Z"
        fill="#7BBF8A" opacity="0.55"/>
  <!-- Right outer leaf -->
  <path d="M 100,182 C 128,172 145,150 134,128 C 122,150 104,166 100,175 Z"
        fill="#7BBF8A" opacity="0.55"/>
  <!-- Left inner leaf -->
  <path d="M 100,182 C 80,173 68,156 76,140 C 84,157 96,168 100,176 Z"
        fill="#5DAA6F" opacity="0.75"/>
  <!-- Right inner leaf -->
  <path d="M 100,182 C 120,173 132,156 124,140 C 116,157 104,168 100,176 Z"
        fill="#5DAA6F" opacity="0.75"/>
  <!-- Central stem -->
  <line x1="100" y1="182" x2="100" y2="152" stroke="#5DAA6F" stroke-width="1.5" opacity="0.6"/>
</svg>
